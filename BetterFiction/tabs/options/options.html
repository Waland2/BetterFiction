<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterFiction settings</title>
    <link rel="stylesheet" href="options.css" />
</head>

<body>
    <main>
        <header>
            <img src="../../icons/ava.png" alt="" width="48" height="48" />
            <div>
                <h1>BetterFiction</h1>
                <p>Settings are saved as soon as you change them.</p>
            </div>
        </header>

        <section aria-labelledby="section-0">
            <h2 id="section-0">Bookmarks</h2>
            <div class="panel">
                <label class="row" for="bookmarks">
                    <span class="text">
                        <span class="name">Bookmarks</span>
                        <span class="desc">Adds a bookmark button to each chapter, so you can save your place and come back to it.</span>
                    </span>
                    <input type="checkbox" class="switch" id="bookmarks" />
                </label>
                <label class="row" for="autoSave">
                    <span class="text">
                        <span class="name">Bookmark automatically</span>
                        <span class="desc">Moves your bookmark forward when you open a later chapter of a story.</span>
                    </span>
                    <input type="checkbox" class="switch" id="autoSave" />
                </label>
                <label class="row" for="markBookmarks">
                    <span class="text">
                        <span class="name">Mark bookmarked stories</span>
                        <span class="desc">Highlights stories you&#x27;ve bookmarked in search results and story lists.</span>
                    </span>
                    <input type="checkbox" class="switch" id="markBookmarks" />
                </label>
                <label class="row" for="organizer">
                    <span class="text">
                        <span class="name">Reading status</span>
                        <span class="desc">Lets you set a status for each bookmarked story (Automatic, Planned, Reading, Completed or Dropped), shown by the bookmark&#x27;s colour.</span>
                    </span>
                    <input type="checkbox" class="switch" id="organizer" />
                </label>
            </div>
        </section>

        <section aria-labelledby="section-1">
            <h2 id="section-1">Reading a story</h2>
            <div class="panel">
                <label class="row" for="entireWork">
                    <span class="text">
                        <span class="name">Entire work button</span>
                        <span class="desc">Adds a button that loads every chapter onto one page.</span>
                    </span>
                    <input type="checkbox" class="switch" id="entireWork" />
                </label>
                <label class="row" for="wordCounter">
                    <span class="text">
                        <span class="name">Words per chapter</span>
                        <span class="desc">Shows each chapter&#x27;s word count in the chapter menu.</span>
                    </span>
                    <input type="checkbox" class="switch" id="wordCounter" />
                </label>
                <label class="row" for="copy">
                    <span class="text">
                        <span class="name">Allow copying text</span>
                        <span class="desc">Lets you select and copy story text.</span>
                    </span>
                    <input type="checkbox" class="switch" id="copy" />
                </label>
                <label class="row" for="adblock">
                    <span class="text">
                        <span class="name">Block ads</span>
                        <span class="desc">Removes ads from pages.</span>
                    </span>
                    <input type="checkbox" class="switch" id="adblock" />
                </label>
            </div>
        </section>

        <section aria-labelledby="section-2">
            <h2 id="section-2">Story details and lists</h2>
            <div class="panel">
                <label class="row" for="groupDescriptions">
                    <span class="text">
                        <span class="name">Group story details</span>
                        <span class="desc">Puts rating, word count, dates and characters on their own lines, so they&#x27;re easier to read.</span>
                    </span>
                    <input type="checkbox" class="switch" id="groupDescriptions" />
                </label>
                <label class="row" for="styleDescriptions">
                    <span class="text">
                        <span class="name">Colour story details</span>
                        <span class="desc">Colours the rating, language, genre and status so they stand out.</span>
                    </span>
                    <input type="checkbox" class="switch" id="styleDescriptions" />
                </label>
                <div class="row field">
                    <label class="text" for="dateFormat">
                        <span class="name">Date format</span>
                        <span class="desc">How dates are shown. Type any order and separator using the parts below.</span>
                    </label>
                    <input type="text" id="dateFormat" placeholder="MM/DD/YY" autocomplete="off" spellcheck="false" />
                    <p class="date-format-hint">
                        <code>Month</code> January &middot; <code>Mon</code> Jan &middot; <code>MM</code> 01 &middot;
                        <code>DD</code> 01 &middot; <code>D</code> 1 &middot; <code>YYYY</code> 2000 &middot; <code>YY</code> 00
                    </p>
                    <p class="date-format-preview">Preview: <span id="dateFormatPreview"></span></p>
                    <p id="dateFormatError" class="date-format-error" role="alert" hidden></p>
                </div>
                <label class="row" for="bigCovers">
                    <span class="text">
                        <span class="name">Larger covers</span>
                        <span class="desc">Shows bigger cover images in story lists.</span>
                    </span>
                    <input type="checkbox" class="switch" id="bigCovers" />
                </label>
                <label class="row" for="separateFics">
                    <span class="text">
                        <span class="name">Separate stories</span>
                        <span class="desc">Draws a border around each story in lists.</span>
                    </span>
                    <input type="checkbox" class="switch" id="separateFics" />
                </label>
                <label class="row" for="profileSorts">
                    <span class="text">
                        <span class="name">More sorting on profiles</span>
                        <span class="desc">Adds sorting by Follows and Favs to the story lists on author profiles.</span>
                    </span>
                    <input type="checkbox" class="switch" id="profileSorts" />
                </label>
            </div>
        </section>

        <section aria-labelledby="section-3">
            <h2 id="section-3">Top bar</h2>
            <div class="panel">
                <label class="row" for="shortcuts">
                    <span class="text">
                        <span class="name">Quick links</span>
                        <span class="desc">Adds icons for your favourite and followed stories to the top bar.</span>
                    </span>
                    <input type="checkbox" class="switch" id="shortcuts" />
                </label>
            </div>
        </section>

        <footer>
            <p>
                This extension is open-source:
                <a href="https://github.com/Waland2/BetterFiction" target="_blank" rel="noopener">GitHub</a>
            </p>
            <p>Developed by Waland2 &amp; shahaadi &middot; version <span id="version"></span></p>
        </footer>
    </main>

    <script src="../../utils/handlers.js"></script>
    <script src="options.js"></script>
</body>

</html>
