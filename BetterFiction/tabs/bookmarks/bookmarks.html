<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterFiction bookmarks</title>
    <link rel="stylesheet" type="text/css" href="bookmarks.css" />
</head>

<body>
    <main>
        <header>
            <div class="heading">
                <h1>Bookmarks</h1>
                <p id="count"></p>
            </div>
            <div class="tools">
                <button type="button" class="button" id="export"
                    title="Save all your bookmarks to a file">Export</button>
                <button type="button" class="button" id="import"
                    title="Replace your bookmarks with the ones in a file">Import</button>
            </div>
        </header>

        <div class="controls">
            <label class="search">
                <span class="visually-hidden">Search bookmarks</span>
                <input type="search" id="search" placeholder="Search by title, author or fandom" autocomplete="off" />
            </label>

            <div class="filters" id="filters" role="group" aria-label="Filter by status">
                <button type="button" class="filter" data-status="All" aria-pressed="true">All <span></span></button>
                <button type="button" class="filter" data-status="Automatic" aria-pressed="false">Automatic <span></span></button>
                <button type="button" class="filter" data-status="Reading" aria-pressed="false">Reading <span></span></button>
                <button type="button" class="filter" data-status="Completed" aria-pressed="false">Completed <span></span></button>
                <button type="button" class="filter" data-status="Planned" aria-pressed="false">Planned <span></span></button>
                <button type="button" class="filter" data-status="Dropped" aria-pressed="false">Dropped <span></span></button>
            </div>

            <label class="sort">
                <span>Sort</span>
                <select id="sort">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="storyName">Title</option>
                    <option value="author">Author</option>
                    <option value="fandom">Fandom</option>
                    <option value="progress">Progress</option>
                </select>
            </label>
        </div>

        <p class="notice" id="notice" role="status" hidden>
            <span id="notice-text"></span>
            <button type="button" class="link-button" id="undo">Undo</button>
        </p>

        <ul class="list" id="list"></ul>
        <p class="empty" id="empty" hidden></p>
    </main>

    <script src="../../utils/handlers.js"></script>
    <script src="bookmarks.js"></script>
</body>

</html>
